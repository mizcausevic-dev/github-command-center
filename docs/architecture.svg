<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" role="img" aria-label="Architecture: clients call one Web-standard handler; middleware runs in a fixed order; the GitHub client spends rate limit only when it must; the same handler runs on Node and in the browser.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4f57"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#fcfcfb"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#15171a">GitHub Command Center: request path</text>
  <text x="40" y="68" font-size="13" fill="#4a4f57">One handle(Request) → Response function. Same code on a Node server and inside the GitHub Pages demo.</text>

  <!-- clients -->
  <g font-size="13" fill="#15171a">
    <rect x="40" y="110" width="200" height="300" rx="14" fill="#eef1f6" stroke="#c9d1de"/>
    <text x="60" y="138" font-weight="700">Clients</text>
    <rect x="60" y="156" width="160" height="56" rx="10" fill="#fff" stroke="#c9d1de"/>
    <text x="74" y="180" font-weight="600">Dashboard</text><text x="74" y="198" font-size="11" fill="#4a4f57">ETag cache, If-Match writes</text>
    <rect x="60" y="226" width="160" height="56" rx="10" fill="#fff" stroke="#c9d1de"/>
    <text x="74" y="250" font-weight="600">curl / scripts</text><text x="74" y="268" font-size="11" fill="#4a4f57">OpenAPI 3.1 contract</text>
    <rect x="60" y="296" width="160" height="96" rx="10" fill="#fff" stroke="#c9d1de"/>
    <text x="74" y="320" font-weight="600">GitHub webhooks</text><text x="74" y="338" font-size="11" fill="#4a4f57">HMAC-SHA256 verified,</text><text x="74" y="354" font-size="11" fill="#4a4f57">delivery de-duplicated,</text><text x="74" y="370" font-size="11" fill="#4a4f57">invalidates repo cache</text>
  </g>

  <!-- API pipeline -->
  <g font-size="12" fill="#15171a">
    <rect x="290" y="110" width="430" height="440" rx="14" fill="#fff" stroke="#1f4fd1" stroke-width="2"/>
    <text x="310" y="138" font-size="14" font-weight="700" fill="#1f4fd1">Command Center API  /api/v1</text>
    <g>
      <rect x="310" y="154" width="390" height="34" rx="8" fill="#f3f4f6"/><text x="324" y="176">1  X-Request-Id (echoed into every problem document)</text>
      <rect x="310" y="194" width="390" height="34" rx="8" fill="#f3f4f6"/><text x="324" y="216">2  Bearer auth when API_TOKEN is set (constant-time compare)</text>
      <rect x="310" y="234" width="390" height="34" rx="8" fill="#f3f4f6"/><text x="324" y="256">3  Token bucket → RateLimit / RateLimit-Policy, 429 + Retry-After</text>
      <rect x="310" y="274" width="390" height="34" rx="8" fill="#f3f4f6"/><text x="324" y="296">4  Accept negotiation → 406</text>
      <rect x="310" y="314" width="390" height="34" rx="8" fill="#f3f4f6"/><text x="324" y="336">5  Router → 404 · 405 + Allow · OPTIONS · HEAD</text>
      <rect x="310" y="354" width="390" height="34" rx="8" fill="#f3f4f6"/><text x="324" y="376">6  Handler: validate (422 + JSON Pointers), If-Match (412/428)</text>
      <rect x="310" y="394" width="390" height="34" rx="8" fill="#f3f4f6"/><text x="324" y="416">7  Idempotency-Key replay on POST · keyset cursor + Link</text>
      <rect x="310" y="434" width="390" height="34" rx="8" fill="#f3f4f6"/><text x="324" y="456">8  Strong ETag from body bytes → 304 on If-None-Match</text>
      <rect x="310" y="474" width="390" height="56" rx="8" fill="#fde9e2"/><text x="324" y="496" font-weight="600">Any error → RFC 9457 application/problem+json</text><text x="324" y="514" font-size="11" fill="#4a4f57">stable type URI, instance, requestId, errors[]</text>
    </g>
  </g>

  <!-- domain -->
  <g font-size="12" fill="#15171a">
    <rect x="290" y="574" width="205" height="96" rx="12" fill="#eef1f6" stroke="#c9d1de"/>
    <text x="306" y="598" font-weight="700">Attention model</text>
    <text x="306" y="618" font-size="11" fill="#4a4f57">8 named signals, additive,</text><text x="306" y="634" font-size="11" fill="#4a4f57">0-100, every point explained</text><text x="306" y="650" font-size="11" fill="#4a4f57">(docs/scoring.md)</text>
    <rect x="515" y="574" width="205" height="96" rx="12" fill="#eef1f6" stroke="#c9d1de"/>
    <text x="531" y="598" font-weight="700">Workspace store</text>
    <text x="531" y="618" font-size="11" fill="#4a4f57">priorities, notes, next actions</text><text x="531" y="634" font-size="11" fill="#4a4f57">Node: atomic JSON file</text><text x="531" y="650" font-size="11" fill="#4a4f57">Demo: localStorage</text>
  </g>

  <!-- GitHub client -->
  <g font-size="12" fill="#15171a">
    <rect x="770" y="110" width="390" height="440" rx="14" fill="#fff" stroke="#c9d1de"/>
    <text x="790" y="138" font-size="14" font-weight="700">GitHub REST client</text>
    <text x="790" y="158" font-size="11" fill="#4a4f57">cheapest path first</text>
    <rect x="790" y="172" width="350" height="40" rx="8" fill="#e6f4e6"/><text x="804" y="197">fresh window: memory hit, no request</text>
    <rect x="790" y="220" width="350" height="40" rx="8" fill="#e6f4e6"/><text x="804" y="245">coalesce identical in-flight requests</text>
    <rect x="790" y="268" width="350" height="40" rx="8" fill="#e6f4e6"/><text x="804" y="293">If-None-Match → 304 (no primary-limit cost)</text>
    <rect x="790" y="316" width="350" height="40" rx="8" fill="#f3f4f6"/><text x="804" y="341">200 → cache body + ETag + Link (same-origin only)</text>
    <rect x="790" y="364" width="350" height="40" rx="8" fill="#f3f4f6"/><text x="804" y="389">5xx / timeout → backoff + jitter, then stale-if-error</text>
    <rect x="790" y="412" width="350" height="40" rx="8" fill="#fdf1d8"/><text x="804" y="437">403/429 → classify primary vs secondary limit</text>
    <rect x="790" y="460" width="350" height="70" rx="8" fill="#eef1f6"/><text x="804" y="484" font-weight="600">api.github.com</text><text x="804" y="502" font-size="11" fill="#4a4f57">X-GitHub-Api-Version: 2026-03-10</text><text x="804" y="518" font-size="11" fill="#4a4f57">repos · issues · pulls · runs · releases · compare · commits · events</text>
  </g>

  <!-- runtimes -->
  <g font-size="12" fill="#15171a">
    <rect x="770" y="574" width="185" height="96" rx="12" fill="#eef1f6" stroke="#c9d1de"/>
    <text x="786" y="598" font-weight="700">Node server</text><text x="786" y="618" font-size="11" fill="#4a4f57">node:http adapter,</text><text x="786" y="634" font-size="11" fill="#4a4f57">live token or --demo</text><text x="786" y="650" font-size="11" fill="#4a4f57">strict CSP static files</text>
    <rect x="975" y="574" width="185" height="96" rx="12" fill="#eef1f6" stroke="#c9d1de"/>
    <text x="991" y="598" font-weight="700">GitHub Pages demo</text><text x="991" y="618" font-size="11" fill="#4a4f57">same handler in-page,</text><text x="991" y="634" font-size="11" fill="#4a4f57">snapshot transport with</text><text x="991" y="650" font-size="11" fill="#4a4f57">real ETags and 304s</text>
  </g>

  <g stroke="#4a4f57" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M240 184 H288"/><path d="M240 254 H288"/><path d="M240 344 H288"/>
    <path d="M720 330 H768"/>
    <path d="M400 550 V572"/><path d="M620 550 V572"/>
  </g>
</svg>
